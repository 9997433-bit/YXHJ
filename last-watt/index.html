<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%23241812'/%3E%3Cpath d='M18 4 8 18h6l-2 10 12-15h-7z' fill='%2335E0FF'/%3E%3C/svg%3E"
    />
    <title>余电 Last Watt — M1 灰盒切片</title>
    <style>
      :root {
        /* Palette is mirrored from GDD §15.2; engine/config.ts is the source of truth. */
        --lw-rust-deep: #241812;
        --lw-electric: #35e0ff;
        --lw-warn: #ff3b30;
        --lw-ink: #d8cec4;
        --lw-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--lw-rust-deep);
        color: var(--lw-ink);
        font-family: var(--lw-mono);
      }

      #lw-app {
        position: fixed;
        inset: 0;
      }

      #lw-app > canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      #lw-boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: radial-gradient(circle at 50% 45%, #34231a 0%, #150e0a 70%);
        font-size: 13px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        transition: opacity 320ms ease;
        z-index: 20;
      }

      #lw-boot[data-hidden='true'] {
        opacity: 0;
        pointer-events: none;
      }

      #lw-boot .lw-boot-title {
        font-size: 22px;
        letter-spacing: 0.5em;
        color: var(--lw-electric);
        text-shadow: 0 0 18px rgba(53, 224, 255, 0.55);
      }

      #lw-boot .lw-boot-bar {
        width: 180px;
        height: 2px;
        background: rgba(216, 206, 196, 0.16);
        overflow: hidden;
      }

      #lw-boot .lw-boot-bar::after {
        content: '';
        display: block;
        width: 45%;
        height: 100%;
        background: var(--lw-electric);
        box-shadow: 0 0 12px var(--lw-electric);
        animation: lw-scan 1.1s ease-in-out infinite;
      }

      @keyframes lw-scan {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(320%);
        }
      }

      #lw-fatal {
        position: fixed;
        inset: 0;
        display: none;
        flex-direction: column;
        gap: 12px;
        padding: 8vh 8vw;
        background: #150e0a;
        z-index: 30;
        overflow: auto;
      }

      #lw-fatal[data-visible='true'] {
        display: flex;
      }

      #lw-fatal h1 {
        margin: 0;
        font-size: 16px;
        letter-spacing: 0.25em;
        color: var(--lw-warn);
      }

      #lw-fatal pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 12px;
        line-height: 1.7;
        color: var(--lw-ink);
        opacity: 0.85;
      }
    </style>
    <script type="module" crossorigin src="/YXHJ/last-watt/assets/index-CigThPrn.js"></script>
  </head>
  <body>
    <div id="lw-app"></div>

    <div id="lw-boot">
      <div class="lw-boot-title">余电</div>
      <div class="lw-boot-bar"></div>
      <div>booting webgl2 renderer</div>
    </div>

    <div id="lw-fatal" role="alert">
      <h1>引擎启动失败 / ENGINE BOOT FAILED</h1>
      <pre id="lw-fatal-body"></pre>
    </div>

  </body>
</html>
