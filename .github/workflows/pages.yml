name: Deploy games to GitHub Pages

on:
  push:
    # cursor/pages-** builds the site without publishing, so a Pages change can
    # be proven before it reaches main.
    branches: [main, 'cursor/pages-**']
    paths:
      - 'games/last-watt/**'
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # write is only for the gh-pages mirror at the end of the job.
      contents: write
      pages: read
    outputs:
      pages_source: ${{ steps.probe.outputs.source }}
    steps:
      - uses: actions/checkout@v4

      # GITHUB_TOKEN may read and deploy to Pages but can never create the site
      # — that is a repo-admin operation no workflow permission unlocks. So a
      # missing site is something the owner must fix, not a build failure.
      - name: Probe the Pages configuration
        id: probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # gh prints the 404 body on stdout, so read build_type only on success.
          source=none
          if found=$(gh api "repos/${{ github.repository }}/pages" --jq '.build_type' 2>/dev/null); then
            source=$found
          fi
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "Pages build_type: $source"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: games/last-watt/package-lock.json

      - name: Build last-watt
        working-directory: games/last-watt
        env:
          # Must match the Pages subpath the artifacts are published under.
          LW_BASE: /${{ github.event.repository.name }}/last-watt/
        run: |
          npm ci
          npm run build

      - name: Stage site
        run: |
          rm -rf _site
          mkdir -p _site/last-watt
          cp -R games/last-watt/dist/. _site/last-watt/
          cp site/index.html _site/index.html
          touch _site/.nojekyll

      - name: Upload Pages artifact
        if: steps.probe.outputs.source == 'workflow' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # The branch source needs the built files committed, so keep gh-pages in
      # step whenever Pages is not publishing straight from this workflow.
      - name: Mirror to gh-pages
        if: steps.probe.outputs.source != 'workflow' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}"
          rm -rf pages
          git clone --depth 1 --branch gh-pages "$remote" pages \
            || { rm -rf pages; mkdir pages; git -C pages init -q -b gh-pages; }
          # Only this game's directory is replaced; sibling games on gh-pages survive.
          rm -rf pages/last-watt
          mkdir -p pages/last-watt
          cp -R _site/last-watt/. pages/last-watt/
          cp _site/index.html pages/index.html
          touch pages/.nojekyll
          cd pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "deploy: ${{ github.sha }}"
          git push "$remote" HEAD:gh-pages

      - name: Report what is still missing
        if: steps.probe.outputs.source == 'none'
        run: |
          {
            echo '### GitHub Pages is not enabled yet'
            echo
            echo 'The build succeeded and `gh-pages` holds the current site, but the'
            echo 'repository has no Pages site. No workflow token can create one.'
            echo
            echo 'Repo owner, one time: **Settings → Pages → Build and deployment →'
            echo 'Source → Deploy from a branch → `gh-pages` / `(root)` → Save**.'
            echo
            echo 'The site then answers at https://9997433-bit.github.io/YXHJ/last-watt/'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build
    if: needs.build.outputs.pages_source == 'workflow' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
